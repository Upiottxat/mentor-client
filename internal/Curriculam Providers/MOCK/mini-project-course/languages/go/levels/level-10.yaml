level_id: level-10-built-in-commands
order: 10
milestone_id: built-in-commands
language: go
build:
    required: true
implementation_guidance:
    - Examine the first element of the parsed argument tokens before attempting any external process spawn calls.
    - Maintain a lookup mechanism or conditional check to match the command name against known built-in identifiers.
    - If a match is found, invoke the corresponding internal function; otherwise, proceed with the standard external execution pipeline.
hints:
