milestone_id: input-output-redirection
language: go
sections:
    - common_section_id: sec-apply-redirection
      syntax_topics:
        - os.File
        - os.Open
        - os.OpenFile
        - os.Stdout
        - os.Stdin
      examples:
        - theory_section_id: sec-apply-redirection
          title: Opening and Redirecting Standard Output
          code: |-
            file, err := os.OpenFile("output.txt", os.O_CREATE|os.O_WRONLY|os.O_TRUNC, 0644)
            if err != nil {
                fmt.Println(err)
            }
            defer file.Close()
            os.Stdout = file
          explanation: This example demonstrates opening a file for writing with truncation flags and reassigning the standard output pointer to that file.
