id: level-implement-cd-command
order: 9
milestone_id: built-in-commands
title: Implement CD Command
goal: Change the current working directory of premium shell process directly.
narrative:
    hook: Your shell can execute external programs and wait for them to finish, but every command runs inside its own isolated child process.
    motivation: If you try to change directories using an external program, only that temporary child process updates its location while your main shell stays completely stationary.
    concrete_demo: Typing a directory-navigation instruction needs to update the active environment of your main process so that subsequent inputs execute inside the newly selected folder.
difficulty: easy
status: development
learning_objectives:
    - Understand how a process maintains its working directory as part of its execution state.
    - Recognize why directory-changing instructions must be handled internally instead of spawning external binaries.
    - Learn how to invoke the system facility that updates the current working directory.
constraints:
    - Must not spawn an external child process for the directory change instruction.
    - Must modify the execution state of the current shell process directly.
    - Must handle standard path arguments correctly.
deliverables:
    - An internal directory-updating routine that modifies the current working directory state.
behaviors:
    - id: implement-cd-command
      description: The shell intercepts directory-change instructions and updates its working directory state directly.
tests:
    - id: test-implement-cd-normal
      behavior_ids:
        - implement-cd-command
      category: functional
      case_type: normal
      kind: predefined
      run_on: test_and_submit
      description: Verifies that supplying a valid target path updates the working directory successfully.
      expected_behavior: The directory updates correctly without spawning external tools.
      io:
        args:
            - cd
            - /tmp
        expected: ""
        matcher: exact
    - id: test-implement-cd-edge
      behavior_ids:
        - implement-cd-command
      category: functional
      case_type: edge
      kind: predefined
      run_on: test_and_submit
      description: Verifies behavior when supplying an invalid or nonexistent target path.
      expected_behavior: The directory remains unchanged and an error indicator is reported.
      io:
        args:
            - cd
            - /nonexistent-directory-xyz
        expected: error
        matcher: trim
    - id: test-implement-cd-oracle
      behavior_ids:
        - implement-cd-command
      category: integration
      case_type: normal
      kind: dynamic_oracle
      run_on: submit_only
      description: Dynamic verification of directory navigation across multiple sequential steps.
      expected_behavior: Sequential path changes update state accurately.
      io:
        args:
            - cd
            - .
        expected: ""
        matcher: exact
