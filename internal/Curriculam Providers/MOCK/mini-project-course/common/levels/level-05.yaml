reference_solution:
    language: go
    files:
        main.go: |-
            package main

            import (
            	"bufio"
            	"fmt"
            	"os"
            	"strings"
            )

            func parseArgs(input string) []string {
            	var args []string
            	var current strings.Builder
            	inQuote := false
            	var quoteChar rune
            	
            	runnes := []rune(input)
            	for i := 0; i < len(runnes); i++ {
            		r := runnes[i]
            		if inQuote {
            			if r == quoteChar {
            				inQuote = false
            			} else {
            				current.WriteRune(r)
            			}
            		} else {
            			if r == '\'' || r == '"' {
            				inQuote = true
            				quoteChar = r
            			} else if r == ' ' || r == '\t' || r == '\r' || r == '\n' {
            				if current.Len() > 0 {
            					args = append(args, current.String())
            					current.Reset()
            				}
            			} else {
            				current.WriteRune(r)
            			}
            		}
            	}
            	if current.Len() > 0 || inQuote {
            		args = append(args, current.String())
            	}
            	return args
            }

            func main() {
            	reader := bufio.NewReader(os.Stdin)
            	for {
            		line, err := reader.ReadString('\n')
            		if len(line) == 0 && err != nil {
            			break
            		}
            		line = strings.TrimSuffix(line, "\n")
            		line = strings.TrimSuffix(line, "\r")
            		if line == "" && err != nil {
            			break
            		}
            		
            		args := parseArgs(line)
            		for _, arg := range args {
            			fmt.Println(arg)
            		}
            		if err != nil {
            			break
            		}
            	}
            }
verified: false
