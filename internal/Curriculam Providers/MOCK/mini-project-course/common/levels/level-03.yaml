reference_solution:
    language: go
    files:
        main.go: |-
            package main

            import (
            	"bufio"
            	"fmt"
            	"os"
            	"strings"
            )

            func main() {
            	reader := bufio.NewReader(os.Stdin)
            	for {
            		line, err := reader.ReadString('\n')
            		if err != nil {
            			break
            		}
            		cmd := strings.TrimSpace(line)
            		if cmd == "exit" {
            			break
            		}
            		if cmd != "" {
            			fmt.Println(cmd)
            		}
            	}
            }
verified: false
