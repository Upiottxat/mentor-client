id: level-3-handle-exit-command
order: 3
milestone_id: repl-loop
title: Handle Exit Command
goal: Gracefully terminate the shell upon receiving an exit command or EOF.
narrative:
    hook: Your interactive loop can now display prompts and read inputs, but it traps you in an infinite cycle with no way out except force-killing the process.
    motivation: A robust application must be polite and cooperative, knowing when its work is complete so it can release system resources and return control back to the operating system cleanly.
    concrete_demo: When an operator types the designated shutdown token or sends an end-of-file signal, the interface acknowledges the request and closes down orderly without raising any errors.
difficulty: easy
status: development
learning_objectives:
    - Recognize specific exit commands entered into the interaction loop.
    - Detect end-of-file conditions from standard input streams.
    - Perform a clean and orderly exit sequence without crashing.
constraints:
    - Must terminate immediately upon receiving the designated exit command.
    - Must terminate gracefully when reaching end-of-file on input streams.
    - Do not leave lingering processes or panic on normal termination paths.
deliverables:
    - An interaction loop capable of detecting termination conditions.
    - A reliable shutdown handler for normal program completion.
behaviors:
    - id: handle-exit-command
      description: The system detects termination signals or specific exit requests and stops execution cleanly.
tests:
    - id: test-handle-exit-command-normal-keyword
      behavior_ids:
        - handle-exit-command
      category: unit
      case_type: normal
      kind: predefined
      run_on: test_and_submit
      description: Verify that inputting the termination command successfully stops the session.
      expected_behavior: The execution loop terminates cleanly without error outputs.
      io:
        stdin: |
            exit
        expected: ""
        matcher: trim
    - id: test-handle-exit-command-edge-eof
      behavior_ids:
        - handle-exit-command
      category: functional
      case_type: edge
      kind: predefined
      run_on: test_and_submit
      description: Verify that sending an end-of-file condition closes the session correctly.
      expected_behavior: The session detects the end of the input stream and exits.
      io:
        expected: ""
        matcher: trim
    - id: test-handle-exit-command-dynamic-fuzz
      behavior_ids:
        - handle-exit-command
      category: integration
      case_type: edge
      kind: dynamic_oracle
      run_on: submit_only
      description: Ensure resilience against varied termination inputs and whitespace.
      expected_behavior: The system correctly interprets valid termination triggers under varied padding.
      io:
        stdin: "   exit   \n"
        expected: ""
        matcher: trim
