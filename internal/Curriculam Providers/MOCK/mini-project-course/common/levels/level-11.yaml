id: level-11-parse-redirection-operators
order: 11
milestone_id: input-output-redirection
title: Parse Redirection Operators
goal: Detect redirection symbols like output redirection and file targets from tokens.
narrative:
    hook: Your shell successfully executes external commands and built-in routines with arguments, but output always streams directly to the terminal screen.
    motivation: Without recognizing redirection symbols, users cannot save program outputs to files or load initial data from saved documents.
    concrete_demo: Imagine typing a command followed by a special symbol and a filename, allowing the parser to separate the command instruction from the file destination.
difficulty: easy
status: development
learning_objectives:
    - Identify specific redirection symbols within a sequence of command tokens
    - Separate command arguments from stream redirection targets
    - Extract target filenames associated with redirection operators
constraints:
    - Do not execute or apply file redirections to streams yet
    - Preserve normal argument ordering before and after redirection operators
    - Handle malformed or missing redirection targets safely
deliverables:
    - A parsing function that identifies redirection operators and their associated file targets from argument tokens
behaviors:
    - id: parse-redirection-operators
      description: Examine token streams to identify redirection symbols and isolate target filenames from regular command arguments.
tests:
    - id: test-parse-redirection-operators-normal-output
      behavior_ids:
        - parse-redirection-operators
      category: unit
      case_type: normal
      kind: predefined
      run_on: test_and_submit
      description: Verifies correct extraction of standard output redirection operators and file targets from a standard token list.
      expected_behavior: Identifies the output redirection symbol and returns the correct target filename alongside remaining command arguments.
      io:
        args:
            - echo
            - hello
            - '>'
            - output_file.txt
        expected: output_file.txt
        matcher: exact
    - id: test-parse-redirection-operators-edge-missing-target
      behavior_ids:
        - parse-redirection-operators
      category: unit
      case_type: edge
      kind: predefined
      run_on: test_and_submit
      description: Verifies parser resilience when a redirection symbol appears at the very end of input without a following target.
      expected_behavior: Correctly flags an error or indicates a missing file target instead of panicking or crashing.
      io:
        args:
            - ls
            - '>'
        expected: error
        matcher: exact
    - id: test-parse-redirection-operators-oracle-dynamic
      behavior_ids:
        - parse-redirection-operators
      category: functional
      case_type: normal
      kind: dynamic_oracle
      run_on: submit_only
      description: Performs randomized check on token separation involving input and output redirection symbols.
      expected_behavior: Accurately extracts redirection operators and respective targets across various input positions.
      io:
        args:
            - cat
            - <
            - input.txt
            - '>'
            - output.txt
        expected: input.txt
        matcher: exact
