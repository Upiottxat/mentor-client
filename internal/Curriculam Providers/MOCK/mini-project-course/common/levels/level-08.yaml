id: level-8
order: 8
milestone_id: process-execution
title: Handle Execution Errors
goal: Gracefully handle command-not-found and execution failures without crashing.
narrative:
    hook: Your shell can successfully spawn and wait for child processes, but typing a non-existent command causes it to crash abruptly.
    motivation: A robust interactive environment must protect itself against user typos and missing binaries instead of terminating unexpectedly.
    concrete_demo: When an invalid program name is provided by the user, the application prints a clear diagnostic message and immediately displays a fresh prompt ready for the next instruction.
difficulty: hard
status: development
learning_objectives:
    - Detect when an external command fails to execute or cannot be found.
    - Report execution errors cleanly to the standard error stream.
    - Ensure the shell process continues running despite invalid commands.
constraints:
    - Do not terminate the shell when encountering invalid commands.
    - Output informative messages for missing or failing programs.
    - Preserve previous process spawning and waiting capabilities.
deliverables:
    - Error handling logic for failed child process execution.
    - Integration tests verifying resilient shell behavior.
behaviors:
    - id: handle-execution-errors
      description: Intercept execution failures and report them cleanly without terminating the parent process.
tests:
    - id: test-handle-errors-normal-1
      behavior_ids:
        - handle-execution-errors
      category: functional
      case_type: normal
      kind: predefined
      run_on: test_and_submit
      description: Verify the shell reports an error and stays active when given a non-existent command.
      expected_behavior: The shell should output an error message to standard error and continue running.
      io:
        stdin: |
            nonexistentcommand12345
            exit
        expected: command not found
        matcher: trim
    - id: test-handle-errors-normal-2
      behavior_ids:
        - handle-execution-errors
      category: integration
      case_type: normal
      kind: predefined
      run_on: test_and_submit
      description: Verify the shell can execute valid commands after encountering a failed command.
      expected_behavior: Subsequent valid commands execute successfully after an error.
      io:
        stdin: |
            badcommand
            echo hello
            exit
        expected: hello
        matcher: trim
    - id: test-handle-errors-edge-1
      behavior_ids:
        - handle-execution-errors
      category: unit
      case_type: edge
      kind: predefined
      run_on: test_and_submit
      description: Verify empty command inputs do not trigger fatal execution faults.
      expected_behavior: The shell handles empty or whitespace-only execution requests safely.
      io:
        stdin: "   \nexit\n"
        expected: ""
        matcher: exact
    - id: test-handle-errors-oracle-1
      behavior_ids:
        - handle-execution-errors
      category: functional
      case_type: normal
      kind: dynamic_oracle
      run_on: submit_only
      description: Verify random invalid inputs trigger resilient handling under dynamic evaluation.
      expected_behavior: Arbitrary non-existent commands are caught and reported cleanly.
      io:
        stdin: |
            randombadinputxyz
            exit
        expected: command not found
        matcher: trim
unlock_policy:
    require_all_current_tests: true
    require_all_previous_tests: true
    allow_level_skipping: false
