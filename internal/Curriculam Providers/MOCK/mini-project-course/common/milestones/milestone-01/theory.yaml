milestone_id: repl-loop
sections:
    - id: sec-prompt
      title: Display Shell Prompt
      content: A shell prompt is a visual indicator that signals the system is ready to accept user commands. Much like a host welcoming a guest at a door, the prompt communicates state, readiness, and context. Mechanically, printing a prompt involves writing a string directly to standard output without appending an automatic newline, ensuring the user types their command immediately adjacent to the indicator. Without a prompt, an interactive program would leave the user staring at a blank screen, unable to discern whether the program is frozen, processing in the background, or waiting for input. Designing an effective prompt establishes the primary communication channel between the human operator and the underlying system loop.
      introduced_at_level_id: display-shell-prompt-level
      used_by_levels: []
      is_shared: false
    - id: sec-read
      title: Read User Input
      content: Once the prompt is displayed, the program must pause execution and listen for user input from standard input streams. Reading user input interactively requires buffered processing because humans type at variable speeds and input arrives character by character. The system collects these characters into a memory buffer until it detects a delimiter, typically a newline character generated when the user presses the enter key. This buffered stream is then parsed into a usable string format for the application logic. Handling input streams correctly also involves managing potential errors, such as unexpected stream closures or read failures, ensuring the application remains robust under various operating conditions.
      introduced_at_level_id: level-2-read-user-input
      used_by_levels: []
      is_shared: false
    - id: sec-exit
      title: Handle Exit Command
      content: An interactive loop cannot run indefinitely without a reliable escape hatch. Graceful termination is critical for releasing system resources, flushing output buffers, and returning control to the parent process or operating system shell. Handling an exit involves monitoring incoming input for specific sentinel values or command strings that signify termination intent, as well as recognizing end-of-file signals generated by keyboard shortcuts. When a termination condition is met, the application performs necessary cleanup operations and exits cleanly with an appropriate status code, preventing hanging processes and orphaned resource allocations.
      introduced_at_level_id: level-3-handle-exit-command
      used_by_levels: []
      is_shared: false
