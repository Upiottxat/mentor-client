level_id: level-implement-cd-command
order: 9
agnostic_test_spec:
    level_id: level-implement-cd-command
    split_ratio: "60:40"
    invocation:
        mode: program
    cases:
        - name: test-implement-cd-normal
          description: Verifies that supplying a valid target path updates the working directory successfully.
          expected_behavior: The directory updates correctly without spawning external tools.
          kind: predefined
          run_on: test_and_submit
          args:
            - cd
            - /tmp
          expected: ""
          matcher: exact
        - name: test-implement-cd-edge
          description: Verifies behavior when supplying an invalid or nonexistent target path.
          expected_behavior: The directory remains unchanged and an error indicator is reported.
          kind: predefined
          run_on: test_and_submit
          args:
            - cd
            - /nonexistent-directory-xyz
          expected: error
          matcher: trim
        - name: test-implement-cd-oracle
          description: Dynamic verification of directory navigation across multiple sequential steps.
          expected_behavior: Sequential path changes update state accurately.
          kind: dynamic_oracle
          run_on: submit_only
          args:
            - cd
            - .
          expected: ""
          matcher: exact
    test_ids:
        - test-implement-cd-normal
        - test-implement-cd-edge
        - test-implement-cd-oracle
reference_solution:
    language: go
    files:
        main.go: |-
            package main

            import (
            	"bufio"
            	"fmt"
            	"os"
            	"path/filepath"
            	"strings"
            )

            func main() {
            	reader := bufio.NewReader(os.Stdin)
            	for {
            		fmt.Print("$ ")
            		line, err := reader.ReadString('\n')
            		if err != nil {
            			break
            		}
            		line = strings.TrimSpace(line)
            		if line == "" {
            			continue
            		}

            		args := strings.Fields(line)
            		cmd := args[0]

            		switch cmd {
            		case "exit":
            			return
            		case "cd":
            			var targetDir string
            			if len(args) < 2 {
            				home, err := os.UserHomeDir()
            				if err != nil {
            					fmt.Fprintln(os.Stderr, "error")
            					continue
            				}
            				targetDir = home
            			} else {
            				targetDir = args[1]
            			}

            			err := os.Chdir(targetDir)
            			if err != nil {
            				fmt.Fprintln(os.Stderr, "error")
            			}
            		case "pwd":
            			dir, err := os.Getwd()
            			if err != nil {
            				fmt.Fprintln(os.Stderr, "error")
            			} else {
            				fmt.Println(dir)
            			}
            		default:
            			fmt.Printf("%s: command not found\n", cmd)
            		}
            	}
            }
