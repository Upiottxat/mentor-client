level_id: level-wait-for-process-completion
order: 7
agnostic_test_spec:
    level_id: level-wait-for-process-completion
    split_ratio: "60:40"
    invocation:
        mode: program
    cases:
        - name: test-wait-process-normal-1
          description: Verifies that executing a short-lived external utility blocks the shell until completion.
          expected_behavior: The shell pauses execution until the external command exits successfully.
          kind: predefined
          run_on: test_and_submit
          args:
            - echo
            - completed
          expected: completed
          matcher: exact
        - name: test-wait-process-normal-2
          description: Verifies correct synchronization when running sequential commands.
          expected_behavior: Each command runs to completion before the shell proceeds.
          kind: predefined
          run_on: test_and_submit
          args:
            - printf
            - line1\nline2
          expected: |-
            line1
            line2
          matcher: exact
        - name: test-wait-process-edge-1
          description: Verifies synchronization behavior when handling empty or minimal output execution.
          expected_behavior: The shell waits for the process even when standard output is empty.
          kind: predefined
          run_on: test_and_submit
          args:
            - "true"
          expected: ""
          matcher: exact
        - name: test-wait-process-oracle-1
          description: Fuzzed verification of process completion waiting behavior.
          expected_behavior: Shell correctly blocks and captures termination status for variable workload utilities.
          kind: dynamic_oracle
          run_on: submit_only
          args:
            - echo
            - oracle_ok
          expected: oracle_ok
          matcher: exact
    test_ids:
        - test-wait-process-normal-1
        - test-wait-process-normal-2
        - test-wait-process-edge-1
        - test-wait-process-oracle-1
reference_solution:
    language: go
    files:
        main.go: |-
            package main

            import (
            	"bufio"
            	"fmt"
            	"os"
            	"os/exec"
            	"strings"
            )

            func main() {
            	args := os.Args[1:]
            	if len(args) == 0 {
            		reader := bufio.NewReader(os.Stdin)
            		for {
            			fmt.Print("> ")
            			text, err := reader.ReadString('\n')
            			if err != nil {
            				break
            			}
            			text = strings.TrimSpace(text)
            			if text == "" {
            				continue
            			}
            			if text == "exit" {
            				break
            			}
            			cmdParts := strings.Fields(text)
            			cmd := exec.Command(cmdParts[0], cmdParts[1:]...)
            			cmd.Stdout = os.Stdout
            			cmd.Stderr = os.Stderr
            			err = cmd.Run()
            			if err != nil {
            				// ignore error for simplicity
            			}
            		}
            	} else {
            		cmd := exec.Command(args[0], args[1:]...)
            		cmd.Stdout = os.Stdout
            		cmd.Stderr = os.Stderr
            		err := cmd.Run()
            		if err != nil {
            			os.Exit(1)
            		}
            	}
            }
