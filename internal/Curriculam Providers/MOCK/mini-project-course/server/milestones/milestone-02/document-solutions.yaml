milestone_id: command-parsing
questions:
    - question_id: q-1
      level_id: level-tokenize-input-string
      answer_index: 1
      explanation: strings.Fields splits a string around each instance of one or more consecutive white space characters, handling multiple spaces gracefully, which is ideal for basic shell tokenization.
    - question_id: q-2
      level_id: level-5-command-parsing
      answer_index: 2
      explanation: Quoted arguments require stateful scanning to treat whitespace characters inside the quotes as literal characters rather than argument delimiters, complicating a simple stateless split.
    - question_id: q-3
      level_id: level-tokenize-input-string
      answer_index: 0
      explanation: Consecutive whitespace characters should be collapsed and ignored as delimiters, ensuring they do not produce empty string tokens unless specifically enclosed in quotes.
challenges:
    - challenge_id: ch-tokenize-basic
      level_id: level-tokenize-input-string
      title: Basic Whitespace Tokenizer
      solution: |-
        package main

        import (
        	"strings"
        )

        func Tokenize(input string) []string {
        	return strings.Fields(input)
        }
    - challenge_id: ch-parse-quotes
      level_id: level-5-command-parsing
      title: Stateful Quoted Argument Parser
      solution: |-
        package main

        import (
        	"errors"
        	"strings"
        )

        func ParseWithQuotes(input string) ([]string, error) {
        	var tokens []string
        	var current strings.Builder
        	inQuotes := false

        	for _, r := range input {
        		switch {
        		case r == '"':
        			inQuotes = !inQuotes
        		case r == ' ' && !inQuotes:
        			if current.Len() > 0 {
        				tokens = append(tokens, current.String())
        				current.Reset()
        			}
        		default:
        			current.WriteRune(r)
        		}
        	}

        	if inQuotes {
        		return nil, errors.New("unterminated quoted string")
        	}

        	if current.Len() > 0 {
        		tokens = append(tokens, current.String())
        	}

        	return tokens, nil
        }
