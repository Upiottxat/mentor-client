milestone_id: repl-loop
questions:
    - question_id: q-1
      level_id: display-shell-prompt-level
      answer_index: 2
      explanation: Standard output is typically line-buffered when connected to a terminal, but block-buffered or fully buffered when redirected. Flushing ensures the prompt appears immediately.
    - question_id: q-2
      level_id: level-2-read-user-input
      answer_index: 1
      explanation: bufio.Scanner allows reading entire lines including spaces easily via Text() or Bytes(), whereas fmt.Scan splits inputs by whitespace.
    - question_id: q-3
      level_id: level-3-handle-exit-command
      answer_index: 0
      explanation: Receiving EOF from standard input indicates the input stream has closed, so the REPL should exit cleanly rather than looping infinitely.
challenges:
    - challenge_id: ch-1
      level_id: display-shell-prompt-level
      title: Implement Shell Prompt Function
      solution: |-
        package main

        import (
        	"fmt"
        	"os"
        )

        func PrintPrompt() {
        	fmt.Print("$ ")
        	os.Stdout.Sync()
        }
    - challenge_id: ch-2
      level_id: level-2-read-user-input
      title: Read User Input Line
      solution: |-
        package main

        import (
        	"bufio"
        	"io"
        )

        func ReadInput(r io.Reader) string {
        	scanner := bufio.NewScanner(r)
        	if scanner.Scan() {
        		return scanner.Text()
        	}
        	return ""
        }
    - challenge_id: ch-3
      level_id: level-3-handle-exit-command
      title: Handle Exit and EOF Gracefully
      solution: |-
        package main

        import (
        	"bufio"
        	"fmt"
        	"os"
        	"strings"
        )

        func main() {
        	scanner := bufio.NewScanner(os.Stdin)
        	for {
        		fmt.Print("$ ")
        		if !scanner.Scan() {
        			break
        		}
        		input := strings.TrimSpace(scanner.Text())
        		if input == "exit" {
        			break
        		}
        	}
        }
interactive_challenges: []
