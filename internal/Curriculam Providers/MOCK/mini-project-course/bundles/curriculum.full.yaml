                		if input == "" {
                			continue
                		}
                		if input == "exit" {
                			break
                		}

                		parts := strings.Fields(input)
                		cmdName := parts[0]
                		var args []string
                		if len(parts) > 1 {
                			args = parts[1:]
                		}

                		cmd := exec.Command(cmdName, args...)
                		cmd.Stdout = os.Stdout
                		cmd.Stderr = os.Stderr
                		cmd.Stdin = os.Stdin

                		err = cmd.Run()
                		if err != nil {
                			fmt.Printf("error: %v\n", err)
                		} else {
                			fmt.Println("success")
                		}
                	}
                }
