curriculum:
    id: simple-shell
    name: Simple Shell
    version: 0.1.0
    target_language: go
    difficulty: beginner
    ecosystem_languages:
        - language: go
          role: primary
          purpose: Main implementation language for the interactive shell.
          extension: .go
milestones:
    - id: repl-loop
      order: 1
      title: Read-Eval-Print Loop
      goal: Establish the foundational interactive loop that displays a prompt, reads user input, and exits cleanly.
      required_capabilities:
        - id: display-shell-prompt
          description: Output a visible prompt indicating the shell is ready for user input.
        - id: read-user-input
          description: Read standard input lines from the user interactively.
        - id: handle-exit-command
          description: Gracefully terminate the shell upon receiving an exit command or EOF.
      level_ids:
        - display-shell-prompt-level
        - level-2-read-user-input
        - level-3-handle-exit-command
      boss_fight:
        title: Interactive REPL Integration
        public_preview: Combine prompt display, line reading, and exit handling into a working interactive loop.
        integrated_behavior_ids:
            - display-shell-prompt
            - read-user-input
            - handle-exit-command
        contract:
            scenario: A user starts the shell, sees a prompt, enters some text, and then exits via command.
            steps:
                - action: Start the shell and observe the initial prompt
                  expected_outcome: The shell prints '> '
                - action: Send input 'hello'
                  expected_outcome: The shell reads the input and displays a new prompt '> '
                - action: Send input 'exit'
                  expected_outcome: The shell terminates gracefully with exit code 0
        harness:
            language: go
            test_code: |-
                package main

                import (
                	"bytes"
                	"io"
                	"os"
                	"os/exec"
                	"strings"
                	"testing"
                )

                func TestREPL(t *testing.T) {
                	cmd := exec.Command("go", "run", "main.go")
                	stdin, err := cmd.StdinPipe()
                	if err != nil {
                		t.Fatalf("failed to get stdin pipe: %v", err)
                	}
                	var stdout bytes.Buffer
                	cmd.Stdout = &stdout

                	if err := cmd.Start(); err != nil {
                		t.Fatalf("failed to start command: %v", err)
                	}

                	_, err = io.WriteString(stdin, "hello\nexit\n")
                	if err != nil {
                		t.Fatalf("failed to write to stdin: %v", err)
                	}

                	err = cmd.Wait()
                	if err != nil {
                		t.Fatalf("command exited with error: %v", err)
                	}

                	output := stdout.String()
                	Expected := "> > > "
                	if !strings.Contains(output, "> ") {
                		t.Errorf("expected prompt not found in output: %q", output)
                	}
                }
            expected_output: '> > > '
        concept_mcqs:
            - id: boss-mcq-repl-loop-1
              type: concept
              question: Why is it important to explicitly flush the standard output stream (stdout) immediately after writing a shell prompt?
              options:
                - To clear the input buffer of any trailing newline characters
                - To allocate memory for the upcoming user command string
                - To ensure the prompt is immediately displayed when output is buffered
                - To reset the terminal color codes back to default values
              answer_index: 2
              explanation: Standard output is typically line-buffered when connected to a terminal, but block-buffered or fully buffered when redirected. Flushing ensures the prompt appears immediately.
            - id: boss-mcq-repl-loop-2
              type: concept
              question: When reading input in a Go REPL using bufio.Scanner, what is the primary advantage over directly using fmt.Scan?
              options:
                - bufio.Scanner automatically executes any shell commands it reads
                - bufio.Scanner safely reads arbitrarily long lines separated by newlines, including spaces
                - fmt.Scan cannot be used with standard input streams in Go
                - bufio.Scanner prevents buffer overflows by restricting input to 8 bytes
              answer_index: 1
              explanation: bufio.Scanner allows reading entire lines including spaces easily via Text() or Bytes(), whereas fmt.Scan splits inputs by whitespace.
            - id: boss-mcq-repl-loop-3
              type: concept
              question: How should a robust Read-Eval-Print Loop handle an EOF (End-Of-File) condition on standard input (e.g., when the user presses Ctrl+D)?
              options:
                - Break out of the REPL loop and terminate the program cleanly with exit code 0
                - Automatically restart the standard input stream and display an error warning
                - Ignore the EOF signal and wait indefinitely for a keyboard interrupt
                - Panic immediately to alert the operating system of an abnormal stream termination
              answer_index: 0
              explanation: Receiving EOF from standard input indicates the input stream has closed, so the REPL should exit cleanly rather than looping infinitely.
    - id: command-parsing
      order: 2
      title: Command Parsing and Tokenization
      goal: Break the raw user input string into executable command names and distinct argument tokens.
      required_capabilities:
        - id: tokenize-input-string
          description: Split a raw input string into whitespace-separated argument tokens.
        - id: handle-quoted-arguments
          description: Support quoted strings as single arguments containing whitespace.
      level_ids:
        - level-tokenize-input-string
        - level-5-command-parsing
      boss_fight:
        title: Advanced Command Line Parser
        public_preview: Test your ability to parse complex command lines containing both normal whitespace-separated tokens and quoted arguments with internal spaces.
        integrated_behavior_ids:
            - tokenize-input-string
            - handle-quoted-arguments
        contract:
            scenario: A user provides an input string containing a mix of standard whitespace-separated arguments and quoted arguments containing spaces. The parser must correctly tokenize the entire input string according to both rules.
            steps:
                - action: Pass the input string 'echo hello world' to the parser.
                  expected_outcome: 'Returns three distinct tokens: ''echo'', ''hello'', and ''world''.'
                - action: Pass the input string 'echo "hello world" foo' to the parser.
                  expected_outcome: 'Returns three distinct tokens: ''echo'', ''hello world'', and ''foo''.'
        harness:
            language: go
            setup: Ensure main.go reads from stdin, parses tokens using both standard whitespace splitting and quote handling, and prints the resulting slice representation.
            test_code: |-
                package main
                import (
                	"fmt"
                	"os/exec"
                	"strings"
                )
                func main() {
                	// Test simple tokenization
                	cmd1 := exec.Command("go", "run", "main.go")
                	cmd1.Stdin = strings.NewReader("echo hello world\n")
                	out1, _ := cmd1.CombinedOutput()
                	fmt.Println(string(out1))

                	// Test quoted arguments
                	cmd2 := exec.Command("go", "run", "main.go")
                	cmd2.Stdin = strings.NewReader("echo \"hello world\" foo\n")
                	out2, _ := cmd2.CombinedOutput()
                	fmt.Println(string(out2))
                }
            expected_output: |
                Tokens: [echo hello world]
                Tokens: [echo hello world foo]
        concept_mcqs:
            - id: boss-mcq-command-parsing-1
              type: concept
              question: When implementing simple whitespace-based tokenization in this language, which standard library function or package is most idiomatic for splitting a command string?
              options:
                - os.SplitString
                - strings.Fields
                - bufio.ScanLines
                - bytes.Split
              answer_index: 1
              explanation: strings.Fields splits a string around each instance of one or more consecutive white space characters, handling multiple spaces gracefully, which is ideal for basic shell tokenization.
            - id: boss-mcq-command-parsing-2
              type: concept
              question: What is the primary operational challenge when introducing quoted arguments (e.g., single or double quotes) into a shell command tokenizer?
              options:
                - Memory allocation overhead increases significantly
                - Go's string type becomes mutable
                - Whitespace characters within quotes must not act as token delimiters
                - Command names can no longer be the first token
              answer_index: 2
              explanation: Quoted arguments require stateful scanning to treat whitespace characters inside the quotes as literal characters rather than argument delimiters, complicating a simple stateless split.
            - id: boss-mcq-command-parsing-3
              type: concept
              question: How should a robust shell parser handle consecutive whitespace characters (e.g., multiple spaces or tabs) between command arguments when no quotes are present?
              options:
                - They should be treated as a single delimiter and ignored, producing no empty tokens
                - They must throw a syntax error immediately
                - Each space must generate a distinct empty string token
                - They should be converted into escape characters
              answer_index: 0
              explanation: Consecutive whitespace characters should be collapsed and ignored as delimiters, ensuring they do not produce empty string tokens unless specifically enclosed in quotes.
    - id: process-execution
      order: 3
      title: Process Execution
      goal: Execute external programs by spawning child processes and waiting for their completion.
      required_capabilities:
        - id: spawn-child-process
          description: Execute external commands using system binaries and passed arguments.
        - id: wait-for-process-completion
          description: Block the shell until the spawned child process finishes execution.
        - id: handle-execution-errors
          description: Gracefully handle command-not-found and execution failures without crashing.
      level_ids:
        - level-6-process-execution
        - level-wait-for-process-completion
        - level-8
      boss_fight:
        title: Command Runner Integration
        public_preview: Combine child process spawning, completion waiting, and error handling into a unified command execution flow.
        integrated_behavior_ids:
            - spawn-child-process
            - wait-for-process-completion
            - handle-execution-errors
        contract:
            scenario: Execute a valid command, wait for its completion, and attempt to run an invalid command to test error handling.
            steps:
                - action: Run a valid external command like 'echo hello'
                  expected_outcome: The command prints 'hello' to stdout and exits with code 0.
                - action: Run an invalid non-existent command like 'nonexistentcmd123'
                  expected_outcome: The shell catches the execution error and prints a descriptive error message without crashing.
        harness:
            language: go
            setup: Ensure the Go environment is initialized.
            test_code: |-
                package main

                import (
                	"bytes"
                	"fmt"
                	"os/exec"
                )

                func main() {
                	cmd1 := exec.Command("echo", "hello")
                	var out bytes.Buffer
                	cmd1.Stdout = &out
                	err := cmd1.Run()
                	if err != nil {
                		fmt.Printf("Error: %v\n", err)
                	}
                	fmt.Print(out.String())

                	cmd2 := exec.Command("nonexistentcmd123")
                	err2 := cmd2.Run()
                	if err2 != nil {
                		fmt.Println("Command execution failed gracefully")
                	}
                }
            expected_output: |
                hello
                Command execution failed gracefully
        concept_mcqs:
            - id: boss-mcq-process-execution-1
              type: concept
              question: When spawning an external process in this language using os/exec, why is it important to carefully separate the command name from its arguments instead of concatenating them into a single string?
              options:
                - Go requires a single string to optimize memory allocation inside the garbage collector.
                - Separating them allows the operating system to automatically run the command in background mode.
                - It prevents command injection vulnerabilities and ensures correct parsing of arguments with spaces.
                - The underlying operating system exec system call only accepts arrays of integers.
              answer_index: 2
              explanation: Passing command and arguments as separate parameters prevents shell injection vulnerabilities and ensures the execve system call correctly interprets the executable path and its argv array.
            - id: boss-mcq-process-execution-2
              type: concept
              question: What is the primary operational difference between using Cmd.Run() and Cmd.Start() followed by Cmd.Wait() in The language's exec package?
              options:
                - Cmd.Run() runs the process asynchronously while Cmd.Start() runs it synchronously.
                - Cmd.Run() blocks until the process finishes, whereas Cmd.Start() launches the process and returns immediately without waiting.
                - Cmd.Run() captures standard error automatically, while Cmd.Start() discards it.
                - There is no functional difference; they are aliases for the same underlying function.
              answer_index: 1
              explanation: Cmd.Run() starts the command and immediately blocks waiting for its completion (equivalent to Start() followed by Wait()). Cmd.Start() non-blockingly launches the process, returning control immediately.
            - id: boss-mcq-process-execution-3
              type: concept
              question: How should a shell robustly handle a scenario where a user inputs a command that does not exist in the system's PATH?
              options:
                - Terminate the shell process immediately to prevent security breaches.
                - Automatically download the missing binary from the official repository.
                - Ignore the error and execute the next command as a shell builtin.
                - Capture the execution error, print a descriptive error message to stderr, and return control to the user prompt.
              answer_index: 3
              explanation: When a command is missing or execution fails, the shell should catch the specific error returned by the execution function (such as exec.ErrNotFound) and print a clean error message to standard error without crashing.
    - id: built-in-commands
      order: 4
      title: Built-in Shell Commands
      goal: Implement internal shell commands that alter the shell state directly rather than launching external processes.
      required_capabilities:
        - id: implement-cd-command
          description: Change the current working directory of the shell process.
        - id: dispatch-builtins
          description: Route recognized command names to built-in handlers instead of execution.
      level_ids:
        - level-implement-cd-command
        - level-10-built-in-commands
      boss_fight:
        title: Shell Built-ins Integration
        public_preview: Test routing built-in commands and changing the current working directory.
        integrated_behavior_ids:
            - implement-cd-command
            - dispatch-builtins
        contract:
            scenario: A user interacts with the shell, navigating directories using the cd command and running built-in commands.
            steps:
                - action: Execute the cd command to change the working directory
                  expected_outcome: The shell successfully changes the current working directory.
                - action: Execute a recognized built-in command
                  expected_outcome: The shell routes the command to its built-in handler and prints the expected output.
        harness:
            language: go
            setup: Initialize test directory structure and build the shell binary.
            test_code: |-
                package main

                import (
                	"fmt"
                	"os/exec"
                )

                func main() {
                	cmd := exec.Command("go", "run", "main.go")
                	err := cmd.Run()
                	if err != nil {
                		fmt.Printf("Error: %v\n", err)
                	}
                	fmt.Println("Directory changed and built-in dispatched successfully")
                }
            expected_output: Directory changed and built-in dispatched successfully
        concept_mcqs:
            - id: boss-mcq-built-in-commands-1
              type: concept
              question: Why must the 'cd' command be implemented as a built-in shell command rather than an external executable process in this language?
              options:
                - External binaries cannot execute file path operations.
                - Go's os/exec package explicitly forbids changing directories.
                - An external process changes only its own working directory, not the parent shell's process state.
                - Built-in commands execute faster because they skip disk reads.
              answer_index: 2
              explanation: External process isolation requires built-ins for state mutations.
            - id: boss-mcq-built-in-commands-2
              type: concept
              question: When implementing a built-in command dispatcher in a Go shell, what is the most robust way to check if a parsed command string is a built-in?
              options:
                - A long chain of nested if/else statements comparing string lengths.
                - A lookup map mapping command strings to handler function pointers.
                - Reflection on the main package scope to find matching function names.
                - Sending an IPC signal to check command existence.
              answer_index: 1
              explanation: Map lookups provide clean O(1) routing.
            - id: boss-mcq-built-in-commands-3
              type: concept
              question: How should a shell built-in command handler handle execution errors, such as a non-existent directory passed to 'cd'?
              options:
                - Return the error gracefully to the shell loop so it can print a message and keep running.
                - Panic immediately to trigger the global crash recovery handler.
                - Exit the shell process entirely with status code 1.
                - Ignore the error and remain in the current working directory.
              answer_index: 0
              explanation: Graceful error returns prevent shell termination.
    - id: input-output-redirection
      order: 5
      title: Input and Output Redirection
      goal: Support redirecting command standard input and standard output streams to files.
      required_capabilities:
        - id: parse-redirection-operators
          description: Detect redirection symbols like output redirection and file targets from tokens.
        - id: apply-file-redirection
          description: Configure standard streams to read from or write to specified files before execution.
      level_ids:
        - level-11-parse-redirection-operators
        - level-12-input-output-redirection
      boss_fight:
        title: Redirecting Shell Streams
        public_preview: Combine parsing of redirection operators with configuring file streams to execute commands with redirected input and output.
        integrated_behavior_ids:
            - parse-redirection-operators
            - apply-file-redirection
        contract:
            scenario: The user runs a command in the Simple Shell that writes its output to a file using redirection, and then reads that file back using input redirection.
            steps:
                - action: Type echo hello > output.txt
                  expected_outcome: The shell parses the redirection operator and writes hello to output.txt.
                - action: Type cat < output.txt
                  expected_outcome: The shell parses the input redirection and prints hello to standard output.
        harness:
            language: go
            test_code: |-
                package main
                import (
                	"bytes"
                	"testing"
                )
                func TestShellRedirection(t *testing.T) {
                	var stdout bytes.Buffer
                	_ = stdout
                }
            expected_output: hello
        concept_mcqs:
            - id: boss-mcq-input-output-redirection-1
              type: concept
              question: When implementing output redirection using '>' in a shell, how should the target file be opened by default if it already exists?
              options:
                - Opened in append mode (O_APPEND)
                - Truncated to zero length (O_TRUNC)
                - Opened strictly for reading only
                - Rejected with an error preventing execution
              answer_index: 1
              explanation: Standard output redirection ('>') typically truncates the existing file to zero length. Therefore, it should be opened with O_TRUNC along with O_WRONLY and O_CREATE.
            - id: boss-mcq-input-output-redirection-2
              type: concept
              question: What is the primary purpose of the dup2 system call (or The language's equivalent os.File redirection mechanics) before executing a command with redirection?
              options:
                - To duplicate the command string for background execution
                - To create a backup copy of the original source code
                - To redirect standard streams by copying a file descriptor onto descriptors 0, 1, or 2
                - To spawn a separate process for handling asynchronous file IO
              answer_index: 2
              explanation: dup2 atomically replaces a standard file descriptor (like stdout 1 or stdin 0) with a target file descriptor, ensuring standard library calls or external processes write to or read from the file.
            - id: boss-mcq-input-output-redirection-3
              type: concept
              question: If a command line contains both an argument list and a redirection operator (e.g., 'echo hello > file.txt'), how should the token parser handle the filename token following '>'?
              options:
                - Extracted as the redirection target file and excluded from the command's regular argument list
                - Concatenated with the redirection operator and passed as a flag to the executable
                - Ignored completely since redirection operators are handled entirely by the kernel
                - Passed as the final positional argument to the command execution function
              answer_index: 0
              explanation: The filename token immediately following the redirection operator must be extracted and treated as the redirection target rather than being passed as a standard command argument.
            - id: boss-mcq-input-output-redirection-4
              type: concept
              question: Why is it important to restore original standard file descriptors (or handle them carefully in a child process) after executing a redirected command in a shell?
              options:
                - To prevent memory leaks in the Go garbage collector
                - To ensure the operating system releases the file locks immediately
                - To comply with POSIX thread safety requirements
                - To prevent subsequent shell commands from unexpectedly reading from or writing to the redirected files
              answer_index: 3
              explanation: If running built-in commands or maintaining a persistent shell loop, failing to restore standard descriptors means subsequent shell output or input will permanently target the redirected files.
levels:
    - id: display-shell-prompt-level
      order: 1
      milestone_id: repl-loop
      title: Display Shell Prompt
      goal: Output a visible prompt indicating the shell is ready for user input.
      narrative:
        hook: Every interactive command-line tool begins with a blank slate and no visible indicator of life.
        motivation: Without a visual prompt, users cannot know if the program is running, hung, or waiting for input.
        concrete_demo: When launching the program, a clean indicator string instantly appears on the screen to show that the system is listening and ready.
      difficulty: easy
      learning_objectives:
        - Understand how a command-line interface communicates readiness through a prompt string.
        - Learn how to write text directly to the standard output stream.
      constraints:
        - Do not read any input from standard input.
        - Do not implement an interactive loop or continuous execution.
        - Do not mention any specific programming language in common fields.
      deliverables:
        - A program that outputs the designated shell prompt string to standard output.
      behaviors:
        - id: display-shell-prompt
          description: Prints a clear, visible shell prompt to standard output.
      tests:
        - id: test-prompt-normal-output
          behavior_ids:
            - display-shell-prompt
          category: unit
          case_type: normal
          kind: predefined
          run_on: test_and_submit
          description: Verify that the standard output contains the expected prompt string.
          expected_behavior: The shell writes the prompt string to standard output upon startup.
          io:
            expected: '$ '
            matcher: exact
        - id: test-prompt-functional-check
          behavior_ids:
            - display-shell-prompt
          category: functional
          case_type: normal
          kind: predefined
          run_on: test_and_submit
          description: Verify the prompt appears correctly in a standard invocation scenario.
          expected_behavior: The correct prompt indicator is rendered without errors.
          io:
            expected: '$ '
            matcher: trim
        - id: test-prompt-edge-empty-environment
          behavior_ids:
            - display-shell-prompt
          category: functional
          case_type: edge
          kind: dynamic_oracle
          run_on: submit_only
          description: Verify prompt rendering under minimal execution parameters.
          expected_behavior: The shell successfully displays the prompt even with an empty environment.
          io:
            expected: '$ '
            matcher: exact
      unlock_policy:
        require_all_current_tests: true
        require_all_previous_tests: true
        allow_level_skipping: false
      primary_guidance:
        implementation_guidance:
            - Use the standard output printing mechanism provided by your language runtime to display the prompt string.
            - Ensure no trailing unintended characters cause discrepancies with the expected output.
        hints:
            - id: hint-display-shell-prompt-1
              order: 1
              type: conceptual
              content: Interactive command-line applications typically begin by writing a small indicator string to the standard output stream to signal readiness to the user.
              behavior_id: display-shell-prompt
              reveal_after_attempts: 2
              spoiler_risk: false
            - id: hint-display-shell-prompt-2
              order: 2
              type: directional
              content: Look for the primary output writing function in your runtime environment that sends text directly to standard output without adding extra formatting unless desired.
              behavior_id: display-shell-prompt
              reveal_after_attempts: 4
              spoiler_risk: false
      agnostic_test_spec:
        level_id: display-shell-prompt-level
        split_ratio: "60:40"
        invocation:
            mode: program
        cases:
            - name: test-prompt-normal-output
              description: Verify that the standard output contains the expected prompt string.
              expected_behavior: The shell writes the prompt string to standard output upon startup.
              kind: predefined
              run_on: test_and_submit
              expected: '$ '
              matcher: exact
            - name: test-prompt-functional-check
              description: Verify the prompt appears correctly in a standard invocation scenario.
              expected_behavior: The correct prompt indicator is rendered without errors.
              kind: predefined
              run_on: test_and_submit
              expected: '$ '
              matcher: trim
            - name: test-prompt-edge-empty-environment
              description: Verify prompt rendering under minimal execution parameters.
              expected_behavior: The shell successfully displays the prompt even with an empty environment.
              kind: dynamic_oracle
              run_on: submit_only
              expected: '$ '
              matcher: exact
        test_ids:
            - test-prompt-normal-output
            - test-prompt-functional-check
            - test-prompt-edge-empty-environment
      reference_solution:
        language: go
        files:
            main.go: |-
                package main

                import "fmt"

                func main() {
                	fmt.Print("$ ")
                }
    - id: level-2-read-user-input
      order: 2
      milestone_id: repl-loop
      title: Read User Input
      goal: Read standard input lines from the user interactively.
      narrative:
        hook: Your interface can successfully display a prompt, but it currently lacks any mechanism to receive feedback or commands from the person sitting at the terminal.
        motivation: Without the ability to capture incoming text streams, any interactive program remains completely deaf to user intent, rendering dynamic operation impossible.
        concrete_demo: When an operator types a sequence of characters into the terminal window and presses enter, the application captures those exact keystrokes as a continuous data stream for processing.
      difficulty: medium
      learning_objectives:
        - Capture raw text streams provided through standard input streams.
        - Process incoming text lines sequentially for further interpretation.
      constraints:
        - Do not implement command execution or argument parsing in this level.
        - Operate strictly on standard input channels.
      deliverables:
        - A routine capable of capturing a single line of text from standard input.
      behaviors:
        - id: read-user-input
          description: The system successfully reads standard input lines provided by the user.
      tests:
        - id: test-read-input-normal-line
          behavior_ids:
            - read-user-input
          category: unit
          case_type: normal
          kind: predefined
          run_on: test_and_submit
          description: Verify that standard input strings are captured correctly.
          expected_behavior: The input stream data is returned accurately without corruption.
          io:
            stdin: |
                hello world
            expected: |
                hello world
            matcher: exact
        - id: test-read-input-functional-check
          behavior_ids:
            - read-user-input
          category: functional
          case_type: normal
          kind: predefined
          run_on: test_and_submit
          description: Verify processing of multiple sequential input streams.
          expected_behavior: Sequential lines of input are read one after another.
          io:
            stdin: |
                first line
                second line
            expected: |
                first line
                second line
            matcher: exact
        - id: test-read-input-edge-empty
          behavior_ids:
            - read-user-input
          category: unit
          case_type: edge
          kind: predefined
          run_on: test_and_submit
          description: Verify behavior when receiving an immediate end of input signal.
          expected_behavior: The reader handles empty input streams gracefully.
          io:
            expected: ""
            matcher: exact
        - id: test-read-input-dynamic-fuzz
          behavior_ids:
            - read-user-input
          category: functional
          case_type: normal
          kind: dynamic_oracle
          run_on: submit_only
          description: Verify resilience against varied whitespace patterns.
          expected_behavior: Arbitrary whitespace within lines is preserved during reading.
          io:
            stdin: "   spaces and tabs   \n"
            expected: "   spaces and tabs   \n"
            matcher: exact
      unlock_policy:
        require_all_current_tests: true
        require_all_previous_tests: true
        allow_level_skipping: false
      primary_guidance:
        implementation_guidance:
            - Look for standard library facilities designed for buffered text input streams.
            - Ensure proper handling of line termination characters when reading input.
        hints:
            - id: hint-read-user-input-1
