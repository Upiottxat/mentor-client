                package main

                import (
                	"bufio"
                	"fmt"
                	"os"
                	"path/filepath"
                	"strings"
                )

                func main() {
                	reader := bufio.NewReader(os.Stdin)
                	for {
                		fmt.Print("$ ")
                		line, err := reader.ReadString('\n')
                		if err != nil {
                			break
                		}
                		line = strings.TrimSpace(line)
                		if line == "" {
                			continue
                		}

                		args := strings.Fields(line)
                		cmd := args[0]

                		switch cmd {
                		case "exit":
                			return
                		case "cd":
                			var targetDir string
                			if len(args) < 2 {
                				home, err := os.UserHomeDir()
                				if err != nil {
                					fmt.Fprintln(os.Stderr, "error")
                					continue
                				}
                				targetDir = home
                			} else {
                				targetDir = args[1]
                			}

                			err := os.Chdir(targetDir)
                			if err != nil {
                				fmt.Fprintln(os.Stderr, "error")
                			}
                		case "pwd":
                			dir, err := os.Getwd()
                			if err != nil {
                				fmt.Fprintln(os.Stderr, "error")
                			} else {
                				fmt.Println(dir)
                			}
                		default:
                			fmt.Printf("%s: command not found\n", cmd)
                		}
                	}
                }
